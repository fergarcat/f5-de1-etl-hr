version: '3.8'

services:
  # ZOOKEEPER (necesario para Kafka)
  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    container_name: hr_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # KAFKA
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: hr_kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'

  # MYSQL DATABASE
  mysql:
    image: mysql:8.0
    container_name: hr_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    command: --default-authentication-plugin=mysql_native_password

  # MONGODB
  mongodb:
    image: mongo:7.0
    container_name: hr_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE}

  # REDIS
  redis:
    image: redis:7-alpine
    container_name: hr_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ETL CONSUMER
  etl-consumer:
    build: .
    container_name: hr_etl_consumer
    depends_on:
      - kafka
      - mysql
      - mongodb
      - redis
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    command: python -m kafka_consumer.consumer

  # FASTAPI DASHBOARD
  fastapi-app:
    build: .
    container_name: hr_dashboard
    depends_on:
      - mysql
      - redis
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./fastapi:/app/fastapi
    command: python run_fastapi.py

volumes:
  mysql_data:
  mongodb_data:
  redis_data: