services:
  nifi:
    image: apache/nifi:1.28.1
    container_name: nifi
    ports:
      - "8080:8080"
    environment:
      - NIFI_WEB_HTTP_PORT=8080
      - NIFI_WEB_HTTPS_PORT=8080
    volumes:
      - nifi_data:/opt/nifi/nifi-current/
      - nifi_data:/opt/nifi/data/
      - nifi_data:/opt/nifi/logs/
      - nifi_data:/opt/nifi/flowfile_repository/


    networks:
      - etl-network
    restart: unless-stopped

    
volumes:
  nifi_data:


networks:
  etl-network:
    name: etl-network
    external: false