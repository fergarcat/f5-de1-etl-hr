services:
  nifi:
    build:
      context: .
      dockerfile: Dockerfile_Nifi
    container_name: nifi
    ports:
      - "8080:8080"
    
    environment:
      - NIFI_WEB_HTTP_PORT=8080
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository    

    networks:
      - etl-network
    restart: unless-stopped
    command: ["/opt/nifi/nifi-current/bin/nifi.sh", "start", "&&", "tail", "-f", "/opt/nifi/nifi-current/logs/nifi-app.log"]
volumes:
  nifi_conf:
  nifi_state:
  nifi_content:
  nifi_provenance:

networks:
  etl-network:
    name: etl-network
    external: false